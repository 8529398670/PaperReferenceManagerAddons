<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title data-i18n="app.title">&nbsp;</title>
  <link rel="icon" href="/favicon.ico" />
  <!-- Before the stylesheets paint, so a saved dark theme never flashes light. -->
  <script src="/js/theme.js"></script>
  <!-- Bootstrap 5 and its icon font, vendored (see /vendor/README.md), then
       this app's overrides on top. -->
  <link rel="stylesheet" href="/vendor/bootstrap.min.css" />
  <link rel="stylesheet" href="/vendor/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <a id="skip-link" href="#main" class="visually-hidden-focusable" data-i18n="nav.skip"></a>
  <!--
    No text is hardcoded here. Every visible string carries a data-i18n key
    that server/language resolves from language.yaml at runtime, so the copy
    can change (or be removed entirely) without editing this file.

    data-i18n replaces an element's text, so wherever an icon sits next to a
    label the key goes on an inner <span>, never on the element holding both.
  -->
  <nav class="navbar app-navbar border-bottom sticky-top" data-i18n-attr="aria-label:nav.top_label">
    <div class="container-fluid gap-2">
      <!-- The menu button, left, beside the sidebar it controls: on a phone it
           slides the sidebar in, on a wide screen it collapses and expands it
           (remembered in this browser). See Nav.toggleSidebar. -->
      <button id="sidebar-toggle" class="btn btn-link app-icon-button" type="button"
              aria-controls="sidebar" data-i18n-attr="aria-label:nav.menu,title:nav.menu" hidden>
        <i class="bi bi-list" aria-hidden="true"></i>
      </button>
      <!-- The app's name is the way home, from any screen. -->
      <a href="/" class="navbar-brand fw-semibold me-auto" data-i18n="app.title"></a>
      <span class="navbar-text small d-none d-md-inline" data-i18n="app.tagline"></span>
      <div id="app-nav" class="d-flex align-items-center gap-2" hidden>
        <!-- The app's own top-level links go here. Your account is in the
             sidebar, not up here. -->
      </div>
    </div>
  </nav>

  <div class="app-shell">
    <!--
      Every signed-in screen is one entry here and one data-view section in
      <main>. nav.js shows the one the URL hash names, and hides an entry
      whose section the app left hidden (admin-only, switched off, ...).
      offcanvas-lg: a slide-in panel on a phone, a fixed column from lg up.
    -->
    <aside id="sidebar" class="offcanvas-lg offcanvas-start app-sidebar" tabindex="-1" aria-labelledby="sidebar-title" hidden>
      <div class="offcanvas-header border-bottom">
        <h2 class="offcanvas-title h5" id="sidebar-title" data-i18n="app.title"></h2>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebar"
                data-i18n-attr="aria-label:nav.close"></button>
      </div>
      <div class="offcanvas-body">
        <nav id="sidebar-nav" class="nav nav-pills flex-column w-100 gap-1" data-i18n-attr="aria-label:nav.sidebar_label">
          <!-- The app's own screens first. -->
          <a class="nav-link" href="#library" data-nav="library"><i class="bi bi-book" aria-hidden="true"></i><span data-i18n="nav.library"></span></a>
          <a class="nav-link" href="#lists" data-nav="lists"><i class="bi bi-list-ol" aria-hidden="true"></i><span data-i18n="nav.lists"></span></a>
          <hr class="sidebar-rule" />
          <!-- Account: its second line names who is signed in (App.labelAccount). -->
          <a class="nav-link" href="#account" data-nav="account"><i class="bi bi-person-circle" aria-hidden="true"></i><span class="nav-link-text"><span data-i18n="nav.account"></span><span id="sidebar-user" class="nav-link-sub"></span></span></a>
          <a class="nav-link" href="#appearance" data-nav="appearance"><i class="bi bi-palette" aria-hidden="true"></i><span data-i18n="nav.appearance"></span></a>
          <a class="nav-link" href="#shortcuts" data-nav="shortcuts"><i class="bi bi-keyboard" aria-hidden="true"></i><span data-i18n="nav.shortcuts"></span></a>

          <div id="sidebar-admin" class="sidebar-group" hidden>
            <h3 class="sidebar-heading" data-i18n="nav.admin_heading"></h3>
            <a class="nav-link" href="#users" data-nav="users"><i class="bi bi-people" aria-hidden="true"></i><span data-i18n="nav.users"></span></a>
            <a class="nav-link" href="#all-keys" data-nav="all-keys"><i class="bi bi-shield-lock" aria-hidden="true"></i><span data-i18n="nav.all_keys"></span></a>
            <a class="nav-link" href="#logs" data-nav="logs"><i class="bi bi-journal-text" aria-hidden="true"></i><span data-i18n="nav.logs"></span></a>
            <a class="nav-link" href="#jobs" data-nav="jobs"><i class="bi bi-clock-history" aria-hidden="true"></i><span data-i18n="nav.jobs"></span></a>
            <a class="nav-link" href="#settings" data-nav="settings"><i class="bi bi-sliders" aria-hidden="true"></i><span data-i18n="nav.settings"></span></a>
          </div>
          <p id="sidebar-version" class="sidebar-version" hidden></p>
        </nav>
      </div>
    </aside>

    <main hidden id="main" class="app-main" tabindex="-1">
      <p id="maintenance-banner" class="alert alert-warning" role="status" hidden></p>
      <!-- server.announcement, until dismissed. See App.showAnnouncement. -->
      <div id="announcement-banner" class="alert alert-info alert-dismissible" role="status" hidden>
        <span id="announcement-text"></span>
        <button id="announcement-dismiss" type="button" class="btn-close" data-i18n-attr="aria-label:nav.close"></button>
      </div>
      <div id="error-banner" class="alert alert-danger alert-dismissible" role="alert" hidden>
        <span id="error-banner-text"></span>
        <button id="error-copy-button" type="button" class="btn btn-sm btn-outline-danger ms-2" data-i18n="ui.copy"></button>
        <button type="button" class="btn-close" data-box-close="" data-i18n-attr="aria-label:nav.close"></button>
      </div>

      <!-- While the signed-in screens fetch what they show. See App.renderSignedIn. -->
      <div id="app-loading" class="app-loading" role="status" hidden>
        <span class="spinner-border" aria-hidden="true"></span>
        <span class="visually-hidden" data-i18n="ui.loading"></span>
      </div>

      <section id="signed-out" class="card" hidden>
        <div class="card-body">
          <h2 class="h4 card-title" data-i18n="signed_out.heading"></h2>
          <p data-i18n="signed_out.body"></p>
          <p id="invalid-link" class="alert alert-warning mb-0" data-i18n="signed_out.invalid_link" hidden></p>
          <p id="sign-in-expired" class="alert alert-warning mb-0" data-i18n="signed_out.sign_in_expired" hidden></p>
          <p id="session-ended" class="alert alert-warning mb-0" data-i18n="signed_out.session_ended" hidden></p>
        </div>
      </section>

      <!-- Asked for during any sign-in on an account with two-factor on. See
           two_factor.js. -->
      <section id="two-factor-step" class="card" hidden>
        <div class="card-body">
          <h2 class="h4 card-title" data-i18n="two_factor.step_heading"></h2>
          <p data-i18n="two_factor.step_body"></p>
          <form id="two-factor-step-form" autocomplete="off">
            <div class="mb-3">
              <label for="two-factor-step-code" class="form-label" data-i18n="two_factor.code_label"></label>
              <input id="two-factor-step-code" class="form-control" name="code" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" maxlength="24" required />
            </div>
            <button type="submit" class="btn btn-primary" data-i18n="two_factor.step_button"></button>
          </form>
        </div>
      </section>

      <!-- What a login link opens. Nothing is redeemed until the button is
           pressed -- see renderLoginConfirm in app.js. -->
      <section id="login-confirm" class="card" hidden>
        <div class="card-body">
          <h2 class="h4 card-title" data-i18n="login_confirm.heading"></h2>
          <p data-i18n="login_confirm.body"></p>
          <p id="login-switch-warning" class="alert alert-warning" hidden></p>
          <button id="login-confirm-button" class="btn btn-primary" data-i18n="login_confirm.button"></button>
        </div>
      </section>

      <!--
        Every signed-in screen is a <section class="view"> holding its heading
        and a stack of cards, one card per job: a form that makes something
        and the list it adds to are two cards, so each has its own edge. A
        screen that does one thing is one card.
      -->
      <section id="signed-in" hidden>
        <!-- Every paper in Zotero, searched live. static/js/library.js -->
        <section class="view" data-view="library" id="library-panel" hidden>
          <div class="d-flex flex-wrap align-items-baseline gap-2">
            <h2 class="view-title" data-i18n="library.heading"></h2>
            <span id="library-count" class="text-body-secondary small"></span>
          </div>

          <section class="card">
            <div class="card-body">
              <p id="library-status" class="small text-body-secondary mt-1 mb-2" role="status"></p>
              <div class="row g-2 align-items-center" role="search">
                <div class="col-md">
                  <label for="library-search" class="visually-hidden" data-i18n="library.search_label"></label>
                  <input id="library-search" class="form-control" type="search" autocomplete="off" spellcheck="false"
                         data-i18n-attr="placeholder:library.search_placeholder" />
                </div>
                <div class="col-auto form-check form-switch ms-md-2">
                  <input id="library-title-mode" class="form-check-input" type="checkbox" role="switch" />
                  <label for="library-title-mode" class="form-check-label" data-i18n="library.mode_title"></label>
                </div>
                <div class="col-auto">
                  <label for="library-sort" class="visually-hidden" data-i18n="library.sort_label"></label>
                  <select id="library-sort" class="form-select">
                    <option value="relevance" data-i18n="library.sort_relevance"></option>
                    <option value="added" data-i18n="library.sort_added"></option>
                    <option value="year" data-i18n="library.sort_year"></option>
                    <option value="title" data-i18n="library.sort_title"></option>
                  </select>
                </div>
              </div>
              <p class="form-text mb-2" data-i18n="library.search_help"></p>
              <p id="library-results-count" class="small text-body-secondary mb-1" hidden></p>
              <p id="library-fuzzy" class="alert alert-info py-2" role="status" hidden data-i18n="library.fuzzy"></p>
              <ul id="library-results" class="list-unstyled paper-list"></ul>
              <p id="library-empty" class="text-body-secondary" hidden data-i18n="ui.no_matches"></p>
              <button id="library-more" type="button" class="btn btn-outline-secondary" hidden data-i18n="ui.load_more"></button>
            </div>
          </section>
        </section>

        <!-- Curated, ordered, tagged lists of papers. static/js/lists.js (state, sending, adding),
             board_view.js (the rows), list_tools.js (tag bar, selection, filter, order, jump),
             list_panels.js (the list menu's dialogs: columns, colours, history, CSV, references, shelf). -->
        <section class="view" data-view="lists" id="lists-panel" hidden>
          <h2 class="view-title" data-i18n="lists.heading"></h2>

          <section class="card">
            <div class="card-body">
              <div class="d-flex flex-wrap align-items-center gap-2">
                <label for="list-picker" class="visually-hidden" data-i18n="lists.picker_label"></label>
                <select id="list-picker" class="form-select w-auto"></select>
                <div class="dropdown" id="list-menu-holder" hidden>
                  <button id="list-menu" type="button" class="btn btn-outline-secondary btn-sm dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi bi-list-ul" aria-hidden="true"></i> <span data-i18n="lists.menu"></span>
                  </button>
                  <ul id="list-menu-items" class="dropdown-menu"></ul>
                </div>
                <button id="list-new" type="button" class="btn btn-outline-secondary btn-sm">
                  <i class="bi bi-plus-lg" aria-hidden="true"></i> <span data-i18n="lists.new"></span>
                </button>
                <span id="list-count" class="text-body-secondary small"></span>
                <span id="list-state" class="ms-auto small text-body-secondary" role="status"></span>
              </div>
              <form id="list-new-form" class="row g-2 mt-2 align-items-end" autocomplete="off" hidden>
                <div class="col-md">
                  <label for="list-new-name" class="form-label" data-i18n="lists.new_name_label"></label>
                  <input id="list-new-name" class="form-control" name="name" maxlength="80" required
                         data-i18n-attr="placeholder:lists.new_name_placeholder" />
                </div>
                <div class="col-md-auto d-flex gap-2">
                  <button type="submit" class="btn btn-primary" data-i18n="lists.create"></button>
                  <button id="list-new-cancel" type="button" class="btn btn-outline-secondary" data-i18n="ui.cancel"></button>
                </div>
              </form>
              <p id="lists-none" class="text-body-secondary mt-3" hidden data-i18n="lists.none"></p>

              <div id="list-body" hidden>
                <p id="list-view-only" class="alert alert-secondary py-2 mt-2 mb-0" hidden data-i18n="lists.view_only"></p>
                <div id="list-editing" class="row g-2 mt-2">
                  <div id="list-add-wrap" class="col-lg position-relative">
                    <div class="input-group">
                      <label for="list-add" class="visually-hidden" data-i18n="lists.add_label"></label>
                      <input id="list-add" class="form-control" type="search" autocomplete="off" spellcheck="false"
                             role="combobox" aria-expanded="false" aria-controls="list-add-panel"
                             data-i18n-attr="placeholder:lists.add_placeholder" />
                      <label for="list-recent-days" class="visually-hidden" data-i18n="lists.recent_range"></label>
                      <select id="list-recent-days" class="form-select flex-grow-0 w-auto">
                        <option value="7" data-i18n="lists.recent_week"></option>
                        <option value="14" data-i18n="lists.recent_2weeks"></option>
                        <option value="31" data-i18n="lists.recent_month"></option>
                      </select>
                      <button id="list-recent" type="button" class="btn btn-outline-secondary">
                        <i class="bi bi-clock-history" aria-hidden="true"></i> <span data-i18n="lists.recent"></span>
                      </button>
                    </div>
                    <div id="list-add-panel" class="add-results card shadow-sm" hidden>
                      <div id="list-add-head" class="small text-body-secondary px-3 pt-2"></div>
                      <ul id="list-add-results" class="list-group list-group-flush" role="listbox" aria-multiselectable="true"></ul>
                      <div class="d-flex flex-wrap align-items-center gap-2 px-3 py-2 border-top">
                        <button id="list-add-picked" type="button" class="btn btn-primary btn-sm" hidden></button>
                        <span class="form-text m-0 flex-grow-1" data-i18n="lists.add_help"></span>
                        <button id="list-add-close" type="button" class="btn btn-link btn-sm" data-i18n="lists.close"></button>
                      </div>
                    </div>
                  </div>
                </div>

                <section id="list-shelf" class="list-shelf mt-3" hidden aria-labelledby="list-shelf-title">
                  <div class="d-flex flex-wrap align-items-center gap-2">
                    <h3 id="list-shelf-title" class="h6 mb-0"></h3>
                    <div class="form-check mb-0 ms-2">
                      <input id="list-shelf-all" class="form-check-input" type="checkbox" />
                      <label for="list-shelf-all" class="form-check-label small" data-i18n="lists.shelf_all"></label>
                    </div>
                    <label for="list-shelf-tag" class="visually-hidden" data-i18n="lists.shelf_tag_label"></label>
                    <input id="list-shelf-tag" class="form-control form-control-sm tag-input" list="list-tag-options" autocomplete="off"
                           data-i18n-attr="placeholder:lists.shelf_tag_placeholder" />
                    <button id="list-shelf-drop" type="button" class="btn btn-outline-danger btn-sm" data-i18n="lists.shelf_drop"></button>
                    <button id="list-shelf-add" type="button" class="btn btn-primary btn-sm"></button>
                    <span id="list-shelf-note" class="small text-body-secondary"></span>
                  </div>
                  <ol id="list-shelf-rows" class="list-unstyled board-rows board-shelf board-scroll mt-2"></ol>
                </section>

                <div id="list-tagbar" class="list-tagbar mt-3">
                  <div class="d-flex flex-wrap align-items-center gap-2">
                    <input type="checkbox" class="btn-check" id="list-filter-on" autocomplete="off" />
                    <label class="btn btn-outline-secondary btn-sm" for="list-filter-on">
                      <i class="bi bi-funnel" aria-hidden="true"></i> <span data-i18n="lists.filter_tags"></span>
                    </label>
                    <label for="list-filter-match" class="visually-hidden" data-i18n="lists.filter_match_label"></label>
                    <select id="list-filter-match" class="form-select form-select-sm w-auto" hidden>
                      <option value="any" data-i18n="lists.match_any"></option>
                      <option value="all" data-i18n="lists.match_all"></option>
                      <option value="none" data-i18n="lists.match_none"></option>
                    </select>
                    <label for="list-tag-find" class="visually-hidden" data-i18n="lists.tag_find_label"></label>
                    <input id="list-tag-find" class="form-control form-control-sm w-auto" type="text" list="list-tag-options" autocomplete="off"
                           data-i18n-attr="placeholder:lists.tag_find_placeholder" />
                    <label for="list-filter" class="visually-hidden" data-i18n="lists.filter_label"></label>
                    <input id="list-filter" class="form-control form-control-sm w-auto flex-grow-1" type="text" autocomplete="off"
                           data-i18n-attr="placeholder:lists.filter_placeholder" />
                    <span id="list-paint" class="small" hidden></span>
                  </div>
                  <div id="list-chips" class="list-chips mt-2" role="toolbar" data-i18n-attr="aria-label:lists.chips_label"></div>
                  <button id="list-chips-more" type="button" class="btn btn-link btn-sm px-0" aria-controls="list-chips" hidden></button>
                </div>

                <div id="list-tools" class="d-flex flex-wrap align-items-center gap-2 mt-2">
                  <div class="dropdown">
                    <button id="list-order" type="button" class="btn btn-outline-secondary btn-sm dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                      <i class="bi bi-sort-down" aria-hidden="true"></i> <span data-i18n="lists.order_by"></span>
                    </button>
                    <ul id="list-order-items" class="dropdown-menu"></ul>
                  </div>
                  <input type="checkbox" class="btn-check" id="list-auto-move" autocomplete="off" />
                  <label class="btn btn-outline-secondary btn-sm" for="list-auto-move" data-i18n="lists.auto_move" data-i18n-attr="title:lists.auto_move_help"></label>
                  <label for="list-add-where" class="small text-body-secondary" data-i18n="lists.add_where"></label>
                  <select id="list-add-where" class="form-select form-select-sm w-auto">
                    <option value="bottom" data-i18n="lists.where_bottom"></option>
                    <option value="top" data-i18n="lists.where_top"></option>
                    <option value="placed" data-i18n="lists.where_placed"></option>
                  </select>
                  <span class="vr mx-1"></span>
                  <label for="list-jump" class="visually-hidden" data-i18n="lists.jump_label"></label>
                  <input id="list-jump" class="form-control form-control-sm board-row-num" type="text" inputmode="numeric" autocomplete="off"
                         data-i18n-attr="placeholder:lists.jump_placeholder,title:lists.jump_label" />
                  <button id="list-to-anchor" type="button" class="btn btn-outline-secondary btn-sm" disabled>
                    <i class="bi bi-anchor" aria-hidden="true"></i> <span data-i18n="lists.to_anchor"></span>
                  </button>
                  <button id="list-to-top" type="button" class="btn btn-outline-secondary btn-sm" data-i18n-attr="title:lists.to_top,aria-label:lists.to_top">
                    <i class="bi bi-arrow-up" aria-hidden="true"></i>
                  </button>
                  <button id="list-to-bottom" type="button" class="btn btn-outline-secondary btn-sm" data-i18n-attr="title:lists.to_bottom,aria-label:lists.to_bottom">
                    <i class="bi bi-arrow-down" aria-hidden="true"></i>
                  </button>
                  <span class="vr mx-1"></span>
                  <input type="checkbox" class="btn-check" id="list-extra" autocomplete="off" />
                  <label class="btn btn-outline-secondary btn-sm" for="list-extra" id="list-extra-label"></label>
                  <span id="list-selection" class="small ms-auto" hidden></span>
                </div>

                <p id="list-filtered" class="small text-body-secondary mt-2 mb-0" hidden></p>
                <div id="list-scroll" class="board-scroll mt-2">
                  <div id="list-head" class="board-head" aria-hidden="true"></div>
                  <ol id="list-rows" class="list-unstyled board-rows"></ol>
                </div>
                <p id="list-empty" class="text-body-secondary mt-3" hidden data-i18n="lists.empty"></p>
                <datalist id="list-tag-options"></datalist>
              </div>
            </div>
          </section>
        </section>

        <!-- Everything about you: who you are, how you sign in, and what can
             act as you. A feature's card stays hidden until its own JS shows it. -->
        <section class="view" data-view="account" id="account-panel">
          <h2 class="view-title" data-i18n="account.heading"></h2>

          <section class="card">
            <div class="card-body">
              <h3 class="card-title" data-i18n="account.profile_heading"></h3>
              <form id="rename-form" class="row g-3 align-items-end" autocomplete="off">
                <div class="col-md">
                  <label for="display-name" class="form-label" data-i18n="account.display_name_label"></label>
                  <input id="display-name" class="form-control" name="display_name" maxlength="80" required
                         data-i18n-attr="placeholder:account.display_name_placeholder" />
                </div>
                <div class="col-md-auto">
                  <button type="submit" class="btn btn-primary" data-i18n="account.save_button"></button>
                </div>
              </form>
            </div>
          </section>

          <!-- A login link for your own account, to sign in on another device.
               Any signed-in user may mint one; see Api.createMyLoginLink. -->
          <section class="card">
            <div class="card-body">
              <h3 class="card-title" data-i18n="account.device_heading"></h3>
              <p class="text-body-secondary" data-i18n="account.device_description"></p>
              <!-- The link you could still use, if any, and a way to stop it. -->
              <div id="my-live-link" class="d-flex flex-wrap align-items-center gap-2 mb-3" hidden>
                <span id="my-live-link-text" class="text-body-secondary"></span>
                <button id="my-link-cancel-button" class="btn btn-sm btn-outline-danger" data-i18n="login_links.cancel_button"></button>
              </div>
              <button id="my-link-button" class="btn btn-outline-secondary" data-i18n="account.device_button"></button>
              <div id="my-link-box" class="alert alert-info alert-dismissible mt-3 mb-0" hidden>
                <button type="button" class="btn-close" data-box-close="my-link-button" data-i18n-attr="aria-label:nav.close"></button>
                <p id="my-link-notice" class="mb-2"></p>
                <div class="link-box">
                  <code id="my-link-value"></code>
                  <button id="my-link-copy-button" class="btn btn-sm btn-outline-secondary" data-i18n="account.copy_button"></button>
                  <button id="my-link-qr-button" class="btn btn-sm btn-outline-secondary" data-i18n="ui.qr_button"></button>
                </div>
                <canvas id="my-link-qr" class="link-qr" role="img" data-i18n-attr="aria-label:ui.qr_label" hidden></canvas>
              </div>
            </div>
          </section>

          <!-- Only while the owner has auth.two_factor on; see two_factor.js. -->
          <section class="card" id="two-factor-panel" hidden>
            <div class="card-body">
              <h3 class="card-title" data-i18n="two_factor.heading"></h3>

                </div>
                <div id="logs-cal-grid" class="log-cal-grid"></div>
              </div>
              <p id="logs-empty" class="text-body-secondary mb-0" hidden></p>
              <div id="logs-day"></div>
            </div>
          </section>
        </section>

        <!-- Background jobs, owner only; see jobs.js. -->
        <section class="view" data-view="jobs" id="jobs-panel" hidden>
          <h2 class="view-title" data-i18n="jobs.heading"></h2>
          <p class="view-description" data-i18n="jobs.description"></p>
          <section class="card">
            <div class="card-body">
              <div class="table-responsive">
                <table id="jobs-table" class="table table-hover align-middle mb-0" data-empty="jobs.empty">
                  <thead>
                    <tr>
                      <th scope="col" data-i18n="jobs.table_name"></th>
                      <th scope="col" data-i18n="jobs.table_status"></th>
                      <th scope="col" data-i18n="jobs.table_last"></th>
                      <th scope="col" data-i18n="jobs.table_next"></th>
                      <th scope="col" data-i18n="jobs.table_note"></th>
                      <th scope="col" data-i18n="jobs.table_actions"></th>
                    </tr>
                  </thead>
                  <tbody></tbody>
                </table>
              </div>
            </div>
          </section>
        </section>

        <!-- Owner only: config.yaml, one field per setting. See js/settings.js. -->
        <section class="view" data-view="settings" id="settings-panel" hidden>
          <h2 class="view-title" data-i18n="settings.heading"></h2>
          <p class="view-description" data-i18n="settings.description"></p>
          <section class="card">
            <div class="card-body">
              <p class="small text-body-secondary mb-1"><code id="settings-file"></code></p>
              <p id="settings-secret" class="small text-body-secondary"></p>

              <div id="settings-invalid" class="alert alert-danger settings-help" role="alert" hidden></div>
              <div id="settings-stale" class="alert alert-warning" role="alert" data-i18n="settings.stale" hidden></div>
              <div id="settings-read-only" class="alert alert-secondary" role="status" data-i18n="settings.read_only" hidden></div>

              <!-- Outside the form, so Enter in the filter is not a save. -->
              <div class="settings-tools" role="search">
                <div class="d-flex align-items-center gap-2">
                  <label for="settings-filter" class="visually-hidden" data-i18n="settings.filter_label"></label>
                  <input id="settings-filter" class="form-control" type="search" autocomplete="off"
                         data-i18n-attr="placeholder:settings.filter_label" />
                  <span id="settings-filter-status" class="small text-body-secondary text-nowrap" role="status"></span>
                </div>
                <nav id="settings-jump" class="settings-jump" data-i18n-attr="aria-label:settings.jump_label"></nav>
              </div>

              <form id="settings-form" autocomplete="off" novalidate>
                <div id="settings-sections"></div>
                <div id="settings-problems" class="alert alert-danger settings-help" role="alert" hidden></div>
                <div id="settings-changed" class="alert alert-warning d-flex align-items-center gap-2" role="alert" hidden>
                  <span class="me-auto" data-i18n="settings.changed_on_disk"></span>
                </div>
                <div class="settings-actions row-actions">
                  <button type="submit" id="settings-save" class="btn btn-primary" data-i18n="settings.save_button" disabled></button>
                  <button type="button" id="settings-reload" class="btn btn-outline-secondary" data-i18n="settings.reload_button"></button>
                  <span id="settings-unsaved" class="small text-body-secondary"></span>
                </div>
              </form>
            </div>
          </section>
        </section>
      </section>
    </main>
  </div>

  <!-- "Saved.", "Copied.", "API key deleted · Undo": see Dom.toast. -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="toast" class="toast border-0" role="status" aria-live="polite" aria-atomic="true">
      <div id="toast-body" class="toast-body d-flex align-items-center gap-2">
        <span id="toast-text" class="me-auto"></span>
        <button id="toast-action" type="button" class="btn btn-sm btn-light" hidden></button>
      </div>
    </div>
  </div>

  <!-- Asks before anything that cannot be taken back: see Dom.confirm. -->
  <div id="confirm-modal" class="modal fade" tabindex="-1" aria-labelledby="confirm-text" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div id="confirm-text" class="modal-body"></div>
        <div class="modal-footer">
          <button id="confirm-cancel" type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" data-i18n="ui.cancel"></button>
          <button id="confirm-ok" type="button" class="btn btn-danger" data-i18n="ui.confirm"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- What ? opens: see shortcuts.js. -->
  <div id="shortcuts-modal" class="modal fade" tabindex="-1" aria-labelledby="shortcuts-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="shortcuts-title" class="modal-title fs-5" data-i18n="shortcuts.heading"></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" data-i18n-attr="aria-label:nav.close"></button>
        </div>
        <div class="modal-body">
          <!-- Filled from the list in shortcuts.js, with this person's own keys. -->
          <dl id="shortcut-list" class="shortcut-list mb-0"></dl>
        </div>
        <div class="modal-footer">
          <a id="shortcuts-list-change" href="#shortcuts" class="btn btn-link" data-i18n="shortcuts.list_change" hidden></a>
        </div>
      </div>
    </div>
  </div>

  <!-- The list menu's dialogs (columns, colours, history, CSV, references): see ListModal in list_panels.js. -->
  <div id="list-modal" class="modal fade" tabindex="-1" aria-labelledby="list-modal-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="list-modal-title" class="modal-title fs-5"></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" data-i18n-attr="aria-label:nav.close"></button>
        </div>
        <div class="modal-body">
          <div id="list-modal-problem" class="alert alert-danger" role="alert" hidden></div>
          <div id="list-modal-body"></div>
        </div>
        <div id="list-modal-foot" class="modal-footer"></div>
      </div>
    </div>
  </div>

  <!-- A small form in a dialog: see Dom.form, which fills it in. -->
  <div id="form-modal" class="modal fade" tabindex="-1" aria-labelledby="form-modal-title" aria-hidden="true" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <form id="form-modal-form" autocomplete="off">
          <div class="modal-header">
            <h2 id="form-modal-title" class="modal-title fs-5"></h2>
          </div>
          <div class="modal-body">
            <div id="form-modal-fields" class="vstack gap-3"></div>
            <div id="form-modal-problem" class="alert alert-danger mt-3 mb-0" role="alert" hidden></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" data-i18n="ui.cancel"></button>
            <button id="form-modal-save" type="submit" class="btn btn-primary"></button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!--
    Plain scripts in dependency order. No bundler, no modules that need a
    build step: each file adds one global and the browser runs them as-is.
    Third-party libraries go in /vendor/ (downloaded once, served by us) so
    the Content-Security-Policy can stay locked to 'self'.
  -->
  <script src="/vendor/bootstrap.bundle.min.js"></script>
  <script src="/vendor/qrcode.js"></script>
  <script src="/js/dom.js"></script>
  <script src="/js/qr.js"></script>
  <script src="/js/login_links.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/undo.js"></script>
  <script src="/js/shortcuts.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/track.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/pager.js"></script>
  <script src="/js/paper_links.js"></script>
  <script src="/js/library.js"></script>
  <script src="/js/board_view.js"></script>
  <script src="/js/lists.js"></script>
  <script src="/js/list_tools.js"></script>
  <script src="/js/list_csv.js"></script>
  <script src="/js/list_panels.js"></script>
  <script src="/js/keys.js"></script>
  <script src="/js/sessions.js"></script>
  <script src="/js/two_factor.js"></script>
  <script src="/js/logs.js"></script>
  <script src="/js/jobs.js"></script>
  <script src="/js/settings.js"></script>
  <script src="/js/themes_editor.js"></script>
  <script src="/js/fresh.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
