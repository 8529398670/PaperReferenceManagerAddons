    group: Acquisition
    patterns:
    - '\b(?:N|n)\s*=\s*(?P<v>\d{1,5})\s*(?:subjects|participants|healthy|individuals|patients)?'
    - '\b(?P<v>\d{1,5})\s+(?:healthy\s+)?(?:human\s+)?(?:subjects|participants|volunteers|individuals|patients)\b'
    - '\bdata\s+from\s+(?P<v>\d{1,5})\s+(?:subjects|participants)'
    post:
      kind: template
      template: '${0}'
  - name: Preprocessing_Pipeline
    group: Preprocessing
    patterns:
    - '\b(fMRIPrep|FMRIPREP|SPM\s*\d{1,2}|SPM12|SPM8|FSL\s*(?:FEAT|MELODIC)?|AFNI|FreeSurfer|Nilearn|CONN\s+toolbox|DPARSF|DPABI|C-PAC|CPAC|HCP\s+minimal\s+preprocessing|ciftify|ANTs|BrainVoyager|pypreprocess|nipype)\b'
    post:
      kind: template
      template: '${1}'
  - name: Smoothing_FWHM
    group: Preprocessing
    patterns:
    - '\b(?:smooth(?:ed|ing)?)[^.]{0,60}?(?P<v><<NUM>>)\s*[- ]?mm\s*(?:FWHM|full[- ]width)'
    - '\bFWHM\s*(?:of|=|:)?\s*(?P<v><<NUM>>)\s*mm'
    - '\b(?:no|without)\s+(?:spatial\s+)?smoothing\b'
    post:
      kind: negation
      when: '^(?:no|without)\b'
      value: no smoothing
      template: '${v} mm FWHM'
  - name: Atlas_Parcellation
    group: Preprocessing
    patterns:
    - '\b(Schaefer(?:[- ]\d{3})?|Desikan[- ]?Killiany|Destrieux|AAL\s*3?|Automated\s+Anatomical\s+Labeling|Craddock\s*\d*|Harvard[- ]Oxford|Power\s*264|Gordon\s*\d*|Glasser|HCP[- ]MMP1?|Brainnetome|Dosenbach|Shen\s*268|Yeo\s*\d*|DiFuMo|NeuroMark|Julich|Talairach)\b'
    post:
      kind: template
      template: '${1}'
  - name: Registration_Space
    group: Preprocessing
    patterns:
    - '\b(MNI152(?:NLin\d{4}[a-zA-Z]*)?|MNI\s+space|fsaverage\d?|fsLR(?:32k)?|fs_?LR|native\s+space|Talairach\s+space|CIFTI|grayordinate)\b'
    post:
      kind: template
      template: '${1}'
  - name: Task_Paradigm
    group: Preprocessing
    patterns:
    - '\b(resting[- ]state|rest[- ]fMRI|task[- ]based|block\s+design|event[- ]related|naturalistic\s+(?:viewing|listening|stimuli)|movie[- ]watching|story\s+listening|silent\s+(?:reading|naming|word\s+generation|verb\s+generation)|covert\s+(?:speech|naming|reading|articulation)|inner\s+speech|imagined\s+speech|verbal\s+fluency|picture\s+naming|semantic\s+decision|n[- ]back|working\s+memory\s+task|visual\s+imagery|mental\s+imagery)\b'
    post:
      kind: template
      template: '${1}'
      lower: true
datasets:
