# The review screener's rules: the defaults.
#
# These are the "Default" setup. Edit it, or make other named setups, on the
# Screener rules page (admins) or through the API and MCP tools
# (list_screener_setups and the rest). Edits are kept in the database; this
# file is what "Reset to defaults" goes back to. Export YAML on that page gives
# a file in this shape to paste back here.
#
# Patterns are Python regular expressions, matched case-insensitively. In
# extraction patterns <<NUM>> stands for a number and <<WORDS>> for the
# word-numbers below. A post template uses ${v} (the group named v), ${0} (the
# whole match), ${1} (group 1), ${n} (a counted number).
#
# Changing anything re-screens the papers one at a time in the background.
version: 1
criteria_text:
  full:
  - fMRI/BOLD is the dominant modality in the methods section (EEG/MEG/ECoG/fNIRS/intracortical-dominant papers are excluded even when they mention fMRI).
  - 'The paper performs a DECODING task: fMRI in, stimulus / mental content / class label out. Encoding models (stimulus -> brain) and MRI reconstruction / acceleration are excluded.'
  - 'Transformer or attention machinery sits inside the model the AUTHORS BUILT: self / cross-attention, a transformer backbone, or a pretrained transformer (CLIP / GPT / LLaMA / ViT / Whisper) inside the decoding pipeline. Papers that only cite transformers in related work are excluded.'
  abstract:
  - 'The abstract names fMRI/BOLD at least as often as any rival modality (EEG/MEG/ECoG/fNIRS). An abstract states its modality once if at all, so one mention counts, and an abstract that never names it cannot be screened in.'
  - 'The abstract describes a DECODING task: brain in, stimulus / mental content / class label out. Encoding models and MRI reconstruction / acceleration are excluded.'
  - 'The abstract names transformer or attention machinery. One mention counts here, where the full text needs two: an abstract has no related-work section, so a transformer named in it is almost always the authors'' own.'
vocab:
  fmri_evidence:
    label: fMRI evidence
    help: 'Words that count as fMRI evidence. BOLD, voxel and hemodynamics are fMRI-specific.'
    patterns:
    - '\bfMRI\b'
    - '\bfunctional MRI\b'
    - '\bfunctional magnetic resonance\b'
    - '\bBOLD\b'
    - '\bblood[- ]oxygen[- ]level'
    - '\bvoxel'
    - '\bhemodynamic\b'
    - '\bh(?:a)?emodynamic response function\b'
    - '\bHRF\b'
    - '\bTR\s*[=:]'
    - '\brepetition time\b'
    - '\becho[- ]planar\b'
    - '\bcortical surface\b'
    - '\bgrayordinate'
    - '\bMNI\b'
    - '\bparcellat'
    - '\bfunctional connectivity\b'
  fmri_strong:
    label: Strong fMRI phrases
    help: Strong fMRI phrases. Reported beside the verdict; they do not decide it.
    patterns:
    - '\bfMRI (?:data|signal|scan|time ?series|volume|recording|response|activity|acquisition)'
    - '\bBOLD (?:signal|response|time ?series|activity)'
    - '\bvoxel[- ](?:wise|level|space)'
    - '\b(?:whole[- ]brain|cortical) (?:fMRI|BOLD)'
    - '\b4D fMRI\b'
    - '\brs-?fMRI\b'
    - '\bresting[- ]state fMRI\b'
  other_modality:
    label: Rival modalities
    help: 'Rival modalities. If these dominate the methods, it is not an fMRI decoding paper.'
    patterns:
    - '\bEEG\b'
    - '\belectroencephalograph'
    - '\bMEG\b'
    - '\bmagnetoencephalograph'
    - '\bECoG\b'
    - '\belectrocorticograph'
    - '\bsEEG\b'
    - '\bstereo-?EEG\b'
    - '\bfNIRS\b'
    - '\bnear[- ]infrared\b'
    - '\boptode'
    - '\bmicroelectrode'
    - '\bUtah array\b'
    - '\bspike (?:rate|count|train|band)'
    - '\bintracranial\b'
    - '\bintracortical\b'
    - '\belectrode'
    - '\bimplanted array'
    - '\bpenetrating array'
    - '\bfiring rate'
    - '\bthreshold crossing'
    - '\bneural spik'
    - '\bBCI implant'
    - '\bneuroprosthes'
    - '\bEMG\b'
    - '\bEOG\b'
    - '\bMUA\b'
    - '\bLFP\b'
  attn_built:
    label: Attention built
    help: Transformer / attention machinery a paper builds.
    patterns:
    - '\bmulti-?head (?:self-?|cross-?)?attention\b'
    - '\bself-?attention\b'
    - '\bcross-?attention\b'
    - '\bco-?attention\b'
    - '\battention (?:heads?|module|block|mechanism|layer|weights?|map|pooling)\b'
    - '\btransformer (?:encoder|decoder|block|layer|backbone|architecture|module|model)\b'
    - '\bvision transformer\b'
    - '\bViT\b'
    - '\bSwin\b'
    - '\bPerceiver\b'
    - '\bconformer\b'
    - '\bquery (?:tokens?|vectors?)\b'
    - '\bkey[-,/ ]value\b'
    - '\bQKV\b'
    - '\bscaled dot[- ]product\b'
    - '\bpositional (?:encoding|embedding)\b'
    - '\bgraph attention\b'
    - '\bdeformable attention\b'
    - '\battentive\b'
    - '\bCLS token\b'
    - '\bclass token\b'
    - '\btoken(?:iz|is)ation\b'
  attn_pretrained:
    label: Pretrained transformers
    help: 'Pretrained transformer stacks used inside a decoding pipeline. Bare "language model" is deliberately left out: in this literature it often means the neuroanatomical language model.'
    patterns:
    - '\bCLIP\b'
    - '\bOpenCLIP\b'
    - '\bBLIP-?2?\b'
    - '\bLLaVA\b'
    - '\bGPT\b'
    - '\bGPT-?[234]\b'
    - '\bGenerative Pre-?[Tt]rained Transformer\b'
    - '\bLLaMA\b'
    - '\bLlama\b'
    - '\bVicuna\b'
    - '\bMistral\b'
    - '\bBERT\b'
    - '\bRoBERTa\b'
    - '\bDeBERTa\b'
    - '\bT5\b'
    - '\bBART\b'
    - '\bOPT-\d'
    - '\bWhisper\b'
    - '\bwav2vec\b'
    - '\bHuBERT\b'
    - '\bStable Diffusion\b'
    - '\bVersatile Diffusion\b'
    - '\bunCLIP\b'
    - '\bDINOv2\b'
    - '\bBEiT\b'
    - '\bSigLIP\b'
    - '\bQwen\b'
    - '\bfoundation model\b'
    - '\blarge language model\b'
    - '\bLLM\b'
    - '\bvision[- ]language model\b'
    - '\bpre-?trained language model\b'
    - '\bneural language model\b'
    - '\bcausal language model\b'
    - '\bautoregressive language model\b'
    - '\bmasked language model\b'
    - '\blanguage model (?:prior|head|decoder|embeddings?)\b'
    - '\blanguage model\b(?=[^.]{0,80}\b(?:GPT|token|embedding|transformer|fine-?tun|pre-?train|beam|perplexity)\b)'
    - '\bsentence (?:encoder|embedding|transformer)\b'
    - '\bSentenceBERT\b'
    - '\bSBERT\b'
    - '\bcontextual(?:ized)? embeddings?\b'
    - '\bword embeddings? from\b'
    - '\bBERTScore\b'
  ours:
    label: '"We built it" phrases'
    help: 'Phrases meaning "we built it": attention near one of these is the authors'' own.'
    patterns:
    - '\bwe (?:propose|present|introduce|design|develop|build|employ|adopt|use|utilize|implement|train|apply)\b'
    - '\bour (?:model|method|framework|architecture|approach|network|encoder|decoder|pipeline)\b'
    - '\bthe proposed\b'
    - '\bthis (?:paper|work|study) (?:proposes|presents|introduces)\b'
    - '\bconsists? of\b'
    - '\bis composed of\b'
    - '\bcomprises\b'
    - '\bfollowed by\b'
    - '\bwe first\b'
  decode_generic:
    label: Generic decoding phrases (abstract only)
    help: The decoding phrasings an abstract uses. Abstract screen only; adding one never changes the full-text verdicts or the task category.
    patterns:
    - '\bbrain[- ]?decoding\b'
    - '\bneural decoding\b'
    - '\bmind[- ](?:reading|captioning)\b'
    - '\b(?:brain|fMRI|neural|EEG|MEG)[- ]to[- ](?:text|image|speech|音|audio|music|video|語|semantic\w*)\b'
    - '\bdecod\w+[^.]{0,40}\bfrom (?:the )?(?:brain|fMRI|neural|BOLD|cortical|human brain)\b'
    - '\breconstruct\w*[^.]{0,40}\bfrom (?:the )?(?:brain|fMRI|neural|BOLD|cortical|human brain)\b'
    - '\bfrom (?:brain|fMRI|neural|BOLD) (?:activity|recordings?|signals?|responses?|data)\b[^.]{0,70}\b(?:decod|reconstruct|generat|predict|translat|classif|retriev)'
    - '\b(?:decod\w+|reconstruct\w+|translat\w+|generat\w+)\b[^.]{0,50}\b(?:stimul\w+|semantics?|language|speech|images?|visual (?:content|experience)|percept\w+|thoughts?|mental (?:content|imagery|states?))\b[^.]{0,40}\b(?:brain|fMRI|neural|BOLD)\b'
survey_title:
  label: Survey title
  help: 'A title matching this is a review / survey, whatever the text says.'
  pattern: '\b(?:a )?(?:comprehensive |systematic |scoping |brief |short |critical )?(?:review|survey|overview|taxonomy|perspective|tutorial|primer|meta-?analysis)\b'
attention_roles:
- label: transformer backbone over fMRI
  patterns:
  - '\btransformer (?:encoder|backbone|block|layer)'
  - '\bvision transformer\b'
  - '\bViT\b'
  - '\bSwin\b'
  - '\bBrain ?Network ?Transformer\b'
- label: cross-attention fusion
  patterns:
  - '\bcross-?attention\b'
  - '\bco-?attention\b'
- label: self-attention layers
  patterns:
  - '\bself-?attention\b'
  - '\bmulti-?head'
- label: attention pooling / interpretability
  patterns:
  - '\battention pooling\b'
  - '\battention weights? (?:were|are) (?:used|analy)'
- label: pretrained transformer (LM/VLM/CLIP) in pipeline
  patterns: []
  use_vocab: attn_pretrained
tasks:
- name: inner/imagined speech
  priority: 1
  patterns:
  - '\binner speech\b'
  - '\bimagined speech\b'
  - '\bcovert (?:speech|articulation|naming|reading|rehearsal)\b'
  - '\bsilent (?:reading|naming|speech|verb generation|word generation)\b'
  - '\bimagined (?:words?|sentences?|語)\b'
  - '\bverbal imagery\b'
  - '\bself-?generated (?:speech|language|thought)\b'
  - '\bsubvocal'
- name: language / semantic decoding
  priority: 2
  patterns:
  - '\bbrain-?to-?text\b'
  - '\bsemantic (?:decoding|reconstruction)\b'
  - '\bdecod\w+ (?:language|text|words?|sentences?|semantics?|meaning|narrative|story|speech)\b'
  - '\bcontinuous language\b'
  - '\bword[- ]level decoding\b'
  - '\bcloze\b'
  - '\bfMRI-?to-?text\b'
  - '\bopen[- ]vocabulary\b'
  - '\blanguage (?:decoder|decoding)\b'
  - '\bcaption(?:ing|s)? (?:from|of) (?:brain|fMRI|neural)\b'
- name: visual reconstruction / decoding
  priority: 3
  patterns:
  - '\bimage reconstruction\b'
  - '\bvisual (?:reconstruction|decoding|stimulus decoding)\b'
  - '\bfMRI-?to-?image\b'
  - '\breconstruct\w* (?:the )?(?:images?|visual stimuli|seen images?|natural images?|video)\b'
  - '\bbrain-?to-?image\b'
  - '\bimage retrieval\b'
  - '\bdecod\w+ (?:visual|images?|objects?|scenes?|faces?)\b'
  - '\bstimulus reconstruction\b'
  - '\bmind[- ]reading of images\b'
- name: audio / music decoding
  priority: 3
  patterns:
  - '\bbrain-?to-?(?:music|audio|speech signal)\b'
  - '\breconstruct\w* (?:music|audio|sound|speech waveform)\b'
  - '\bmusic (?:reconstruction|retrieval) from\b'
  - '\bdecod\w+ (?:music|audio|sound|heard speech)\b'
- name: clinical / psychiatric classification
  priority: 5
  patterns:
  - '\b(?:autism|ASD|Alzheimer|AD\b|MCI\b|schizophrenia|depression|MDD\b|ADHD|bipolar|Parkinson|epilep\w+)\b[^.]{0,80}\b(?:classif|diagnos|detect|predict|identif)'
  - '\b(?:classif|diagnos|detect)\w*[^.]{0,60}\b(?:autism|ASD|Alzheimer|schizophrenia|MDD|ADHD|bipolar|disorder|disease|patients? vs)\b'
  - '\bneuropsychiatric (?:disorder|disease)\b'
  - '\bdisease (?:classification|diagnosis|prediction)\b'
- name: brain state / cognitive task decoding
  priority: 4
  patterns:
  - '\btask (?:state )?(?:classification|decoding|identification)\b'
  - '\bcognitive state (?:decoding|classification)\b'
  - '\bbrain state (?:decoding|classification|prediction)\b'
  - '\bmental state decoding\b'
  - '\bdecod\w+ (?:task|cognitive states?|mental states?|conditions?)\b'
  - '\bMVPA\b'
- name: individual fingerprinting / trait prediction
  priority: 5
  patterns:
  - '\bfingerprint\w*\b'
  - '\bsubject identification\b'
  - '\bindividual identification\b'
  - '\b(?:age|sex|gender|IQ|intelligence|fluid intelligence|behaviou?ral trait)[^.]{0,40}\bpredict\w*'
  - '\bphenotype prediction\b'
unclassified_priority: 6
exclusions:
  survey:
    label: review / survey (not a primary model paper)
    patterns:
    - '\b(?:this|our|the present)\s+(?:comprehensive\s+|systematic\s+|scoping\s+|narrative\s+)?(?:review|survey|overview|taxonomy|meta-?analysis)\b'
    - '\bin this (?:review|survey)\b'
    - '\bwe (?:review|survey|summarize the literature)\b'
    - '\bwe provide a (?:comprehensive )?(?:review|survey|overview)\b'
    - '\bPRISMA\b'
    - '\bsystematic literature (?:review|search)\b'
  encoding:
    label: 'encoding model only (stimulus -> brain, not brain -> stimulus)'
    patterns:
    - '\bencoding model\b[^.]{0,120}\bpredict\w*[^.]{0,40}\b(?:brain|neural|voxel|BOLD)\s+(?:response|activity)'
    - '\bwe (?:build|train|fit) (?:an? )?encoding model'
    - '\bpredict\w* (?:voxel|brain|neural|BOLD) (?:responses?|activity) from\b'
  reconstruction:
    label: 'fMRI image reconstruction / acceleration (signal processing, not decoding)'
    patterns:
    - '\b(?:accelerat\w+|undersampl\w+|k-?space|compressed sensing)\b[^.]{0,100}\breconstruction\b'
    - '\bimage reconstruction\b[^.]{0,80}\b(?:k-?space|MRI acquisition|scan time)\b'
    - '\bdenoising of fMRI\b'
    - '\bmotion (?:correction|artifact removal)\b'
reasons:
  survey: review / survey (not a primary model paper)
  not_fmri: non-fMRI modality (EEG/MEG/ECoG/fNIRS dominant)
  no_fmri_named: the abstract never names fMRI
  no_attention: 'no transformer/attention inside the authors'' own model'
  no_attention_abstract: the abstract names no transformer / attention machinery
  encoding: 'encoding model only (stimulus -> brain, not brain -> stimulus)'
  reconstruction: 'fMRI image reconstruction / acceleration (signal processing, not decoding)'
  no_decoding: no clear fMRI decoding task
  no_text: no paper text found
thresholds:
  full:
    methods_min_chars:
      value: 400
      why: The methods section is the core text when it is longer than this; otherwise the whole body is.
    fmri_full_min:
      value: 8
      why: fMRI evidence needed across the whole paper.
    fmri_core_min:
      value: 4
      why: fMRI evidence needed in the methods (core) text.
    dom_core_min:
      value: 5
      why: 'Dominance in the methods: fMRI evidence at least this...'
    dom_core_ratio:
      value: 0.9
      why: '...and at least this times the rival-modality evidence in the methods.'
    dom_full_min:
      value: 10
      why: 'Dominance over the whole paper: fMRI evidence at least this...'
    dom_full_ratio:
      value: 0.75
      why: '...and at least this times the rival-modality evidence overall. Either dominance passes.'
    multimodal_min:
      value: 5
      why: Flag multimodal when both fMRI and rival evidence in the methods reach this.
    attn_near_window:
      value: 500
      why: 'Characters between an attention word and a "we built it" phrase for the attention to count as the authors'' own.'
    attn_methods_min:
      value: 2
      why: Attention-built mentions in the methods that pass on their own.
    attn_total_min:
      value: 3
      why: Built + pretrained mentions in the methods that pass on their own.
    attn_total_with_ours_min:
      value: 2
      why: Built + pretrained mentions that pass when attributed to the authors.
    attn_methods_with_ours_min:
      value: 1
      why: Attention-built mentions that pass when attributed to the authors.
    task_weight_title:
      value: 3
      why: Weight of a task phrase in the title.
    task_weight_abstract:
      value: 2
      why: Weight of a task phrase in the abstract.
    task_weight_full:
      value: 1
      why: Weight of a task phrase in the full text.
    decoding_min:
      value: 2
      why: 'The best task''s weighted score needed to call the paper a decoding paper.'
    survey_weight_title:
      value: 4
      why: Weight of a survey phrase in the title.
    survey_weight_abstract:
      value: 2
      why: Weight of a survey phrase in the abstract.
    survey_weight_body:
      value: 1
      why: Weight of a survey phrase in the opening of the body.
    survey_body_chars:
      value: 6000
      why: How much of the body opening is searched for survey phrases.
    survey_min:
      value: 4
      why: Weighted survey score that excludes the paper.
    encoding_min:
      value: 2
      why: Encoding-model phrases needed to name that as the exclusion reason.
    reconstruction_min:
      value: 2
      why: Reconstruction / acceleration phrases needed to name that as the exclusion reason.
    borderline_attn_min:
      value: 1
      why: 'Excluded only for weak attention, with at least this many attention mentions in the methods...'
    borderline_attn_max:
      value: 2
      why: '...and at most this many: flagged borderline, worth a human look.'
  abstract:
    fmri_min:
      value: 1
      why: 'An abstract states its modality once: one mention counts, as long as fMRI is named at least as often as any rival.'
    multimodal_min:
      value: 1
      why: Flag multimodal when both fMRI and a rival are named this often.
    attn_near_window:
      value: 300
      why: 'Characters between an attention word and a "we built it" phrase.'
    attn_total_min:
      value: 1
      why: 'An abstract has no related-work section, so one transformer mention is almost always the authors'' own.'
    task_weight_title:
      value: 3
      why: Weight of a task phrase in the title.
    task_weight_abstract:
      value: 2
      why: Weight of a task phrase in the abstract.
    decoding_min:
      value: 2
      why: Best task score plus generic decoding phrases needed to call it decoding.
    survey_weight_title:
      value: 4
      why: Weight of a survey phrase in the title.
    survey_weight_abstract:
      value: 2
      why: Weight of a survey phrase in the abstract.
    survey_min:
      value: 4
      why: Weighted survey score that excludes the paper.
    encoding_min:
      value: 1
      why: Encoding-model phrases needed to name that as the reason.
    reconstruction_min:
      value: 1
      why: Reconstruction / acceleration phrases needed to name that as the reason.
extraction:
  text_cap:
    value: 150000
    why: Characters of methods + body scanned for fields (guards against a runaway text dump).
  context_window:
    value: 200
    why: Characters of context kept around each match as its quote.
  evidence_quotes:
    value: 3
    why: Quotes kept per field.
  evidence_chars:
    value: 600
    why: Longest quote kept.
  word_numbers:
    one: 1
    two: 2
    three: 3
    four: 4
    five: 5
    six: 6
    seven: 7
    eight: 8
    nine: 9
    ten: 10
    eleven: 11
    twelve: 12
    sixteen: 16
    twenty: 20
    twenty-four: 24
    thirty-two: 32
    forty: 40
    sixty-four: 64
  macros:
    NUM: '[0-9]+(?:\.[0-9]+)?'
  fields:
  - name: N_Transformer_Layers
    group: Architecture
    patterns:
    - '\b(?P<v>\d{1,3}|<<WORDS>>)\s+(?:stacked\s+|consecutive\s+|cascaded\s+)?(?:transformer|encoder|decoder|attention|self-?attention|ViT|Swin|conformer)\s+(?:encoder\s+|decoder\s+)?(?:layers|blocks|modules|stages)\b'
    - '\b(?:cascade|stack|sequence|series)\s+of\s+(?P<v>\d{1,3}|<<WORDS>>)\s+(?:transformer\s+|attention\s+|encoder\s+|decoder\s+)?(?:layers|blocks|modules)\b'
    - '\b(?:transformer|encoder|decoder|backbone|model)\s+(?:has|with|of|consists?\s+of|comprises?|contains?|is\s+composed\s+of|uses?|employs?)\s+(?P<v>\d{1,3}|<<WORDS>>)\s+(?:transformer\s+)?(?:layers|blocks|modules)\b'
    - '\b(?:number\s+of\s+)?(?:transformer\s+|encoder\s+|hidden\s+)?layers?\s*(?:is|was|are|were|=|:)\s*(?P<v>\d{1,3})\b'
    - '\b(?:num_?layers|n_?layers|depth|num_?blocks|n_?blocks)\s*[=:]\s*(?P<v>\d{1,3})\b'
    - '\bdepth\s+(?:of|is|was|=|:)\s*(?P<v>\d{1,3}|<<WORDS>>)\b'
    - '\b(?P<v>\d{1,3}|<<WORDS>>)[- ]layer(?:ed)?\s+(?:transformer|encoder|decoder|ViT|BERT|GPT|network|architecture|MLP)\b'
    - '\bL\s*=\s*(?P<v>\d{1,3})\s*(?:transformer\s+)?layers?\b'
    - '\b\|\s*(?:#\s*)?(?:layers|depth|blocks)\s*\|\s*(?P<v>\d{1,3})\s*\|'
    - '\b(?:layer|block|stage)\s+numbers?\s*(?:of|is|was|=|:)\s*(?P<v>\d{1,3})\b'
    post:
      kind: count
      template: '${n} layers'
  - name: Layer_Depths_Per_Stage
    group: Architecture
    patterns:
    - '\bnumbers?\s+of\s+layers?\b[^.]{0,60}?\{\s*(?P<v>\d{1,2}(?:\s*,\s*\d{1,2}){1,5})\s*\}'
    - '\b(?:depths?|stage\s+depths?|layers?\s+per\s+stage)\s*(?:=|:|of)\s*[\{\[]\s*(?P<v>\d{1,2}(?:\s*,\s*\d{1,2}){1,5})\s*[\}\]]'
    - '\bL\s*1\s*,\s*L\s*2[^=]{0,20}=\s*\{\s*(?P<v>\d{1,2}(?:\s*,\s*\d{1,2}){1,5})\s*\}'
    post:
      kind: template
      template: '{${v}} blocks per stage'
  - name: N_Attention_Heads
    group: Architecture
    patterns:
    - '\b(?P<v>\d{1,3}|<<WORDS>>)\s+(?:parallel\s+)?(?:attention|self-?attention|cross-?attention|multi-?head)\s+heads\b'
    - '\b(?:number\s+of\s+)?(?:attention\s+)?heads?\s*(?:is|was|are|were|=|:)\s*(?P<v>\d{1,3})\b'
    - '\b(?:num_?heads|n_?heads|nhead|num_?attention_?heads)\s*[=:]\s*(?P<v>\d{1,3})\b'
    - '\b(?:multi-?head\s+)?(?:self-?|cross-?)?attention\s+with\s+(?P<v>\d{1,3}|<<WORDS>>)\s+heads\b'
    - '\bh\s*=\s*(?P<v>\d{1,2})\s+(?:attention\s+)?heads\b'
    - '\b(?P<v>\d{1,3}|<<WORDS>>)[- ]head(?:ed|s)?\s+(?:self-?attention|cross-?attention|multi-?head|attention|MSA|MHA|MHSA)\b'
    - '\b(?:with|using|of)\s+(?P<v>\d{1,3}|<<WORDS>>)\s+heads\b'
    - '\b\|\s*(?:#\s*)?(?:heads|attention heads)\s*\|\s*(?P<v>\d{1,3})\s*\|'
    - '\bhead\s+numbers?\s*(?:of|is|was|=|:)\s*(?P<v>\d{1,3})\b'
    - '\bthe\s+(?:cross-?attention|self-?attention|attention)\s+layers?\s+with\s+(?P<v>\d{1,3}|<<WORDS>>)[- ]head'
    post:
      kind: count
      template: '${n} heads'
  - name: Hidden_Embed_Dim
    group: Architecture
    patterns:
