consensus:
  min_hits_full:
    value: 2
    why: Mentions of a dataset a full paper needs before it counts as using it.
  min_hits_abstract:
    value: 1
    why: 'The same for an abstract, which names its data once.'
  window:
    value: 700
    why: Characters either side of a dataset mention searched for acquisition parameters.
  max_spots:
    value: 40
    why: Dataset mentions per paper looked at.
  voxel_max_mm:
    value: 5.0
    why: 'A larger "voxel" is a smoothing kernel or FOV, not a voxel.'
  min_papers:
    value: 2
    why: 'Papers that must report a value before it is the dataset''s consensus.'
  top_k:
    value: 3
    why: Values shown per dataset parameter (the consensus and its alternatives).
  params:
  - name: TR
    pattern: '\b(?:TR|repetition time)\s*(?:\([A-Z]+\))?\s*[=:of ]{1,4}\s*(\d+(?:\.\d+)?)\s*(ms|msec|s\b|sec|seconds?)?'
    ignore_case: true
  - name: TE
    pattern: '\b(?:TE|echo time)\s*(?:\([A-Z]+\))?\s*[=:of ]{1,4}\s*(\d+(?:\.\d+)?)\s*(ms|msec|s\b|sec)?'
    ignore_case: true
  - name: Flip_Angle
    pattern: '\bflip angle\s*(?:\(FA\))?\s*[=:of ]{1,4}\s*(\d+(?:\.\d+)?)\s*(?:°|deg)?'
    ignore_case: true
  - name: Voxel_Size
    pattern: '\b(\d+(?:\.\d+)?\s*(?:[x×]\s*\d+(?:\.\d+)?\s*){0,2}mm)(?:\s*3|³)?\s*(?:isotropic|iso)?'
    ignore_case: true
  - name: Field_Strength
    pattern: '\b(1\.5|3|4|7|9\.4)\s*[- ]?(?:T|Tesla)\b'
    ignore_case: true
  - name: Multiband
    pattern: '\bmulti-?band\s*(?:factor)?\s*(?:of|=|:)?\s*(\d)\b'
    ignore_case: true
  - name: N_Slices
    pattern: '\b(\d{2,3})\s+slices\b'
    ignore_case: true
  - name: Scanner
    pattern: '\b(Siemens\s+\w+|Philips\s+\w+|GE\s+\w+)\b'
    ignore_case: false
  voxel_noise_left: '(smooth\w*|FWHM|kernel|field of view|FOV|matrix|thickness|gap|in-?plane|slice)\W{0,20}$'
  aliases_ignore_case: false
  fallback:
    Field_Strength: Field_Strength
    Scanner_Vendor_Model: Scanner
    TR: TR
    TE: TE
    Flip_Angle: Flip_Angle
    Voxel_Size: Voxel_Size
    Slices: N_Slices
    Multiband_SMS: Multiband
missing:
  precision:
    value: 0.94
    why: 'Measured once over the 377 papers of the old built /review that had an OpenAlex abstract: 52 of the 55 this screen let through were also included by the full-text screen.'
  max_nearmiss:
    value: 400
    why: Near misses kept (works failing exactly one criterion).
  miss_labels:
    attention: names no architecture
    decoding: no decoding verb
    fmri: modality contested
  caveat: 'An abstract-only screen. Most of what it misses is papers whose abstract never names an architecture at all; there is no threshold that recovers a word the abstract does not contain. Read this as a shortlist of candidates, never as a review.'
